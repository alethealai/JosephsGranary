<div class="accordion-container">
  <div *ngFor="let item of items" class="accordion-item">
    <div class="accordion-header" (click)="togglePanel(item.id)">
      <span>{{ item.title }}</span>
      <span class="arrow" [class.open]="isOpen(item.id)">&#9656;</span>
    </div>

    <div class="accordion-body" [class.open]="isOpen(item.id)">
      <div class="content">
        {{ item.content }}
      </div>
    </div>
  </div>
</div>
